name: AI Buddy Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          LIVEKIT_URL: wss://test.livekit.cloud
          LIVEKIT_API_KEY: devkey_test_api_key_32chars_long
          LIVEKIT_API_SECRET: secret_test_api_secret_32chars_long
          OPENAI_API_KEY: mock_openai_key
          TOKEN_TTL_MINUTES: 15
        run: |
          pytest -v

  mobile-ci:
    name: Mobile Typecheck & Jest Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Jest Test Suites
        run: npm test
